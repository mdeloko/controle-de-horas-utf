services:
  backend:
    build:
      context: ./backend
    environment:
      NODE_ENV: production
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:-chave_secreta}
    volumes:
      - backend-data:/app/dist/database/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
    ports:
      - "${APP_PORT:-5000}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend-data:
